<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The UZ801 dongle's software layers and its USB interfaces">
  <style>
    .t { font-size: 15px; font-weight: 600; fill: #1f2328; }
    .s { font-size: 12.5px; fill: #57606a; }
    .h { font-size: 13px; font-weight: 700; fill: #57606a; letter-spacing: .04em; }
    .a { fill: #ddf4ff; stroke: #0969da; stroke-width: 2; }
    .b { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
    .c { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.5; }
    .ln { stroke: #57606a; stroke-width: 1.6; }
  </style>
  <rect width="1000" height="560" rx="12" fill="#f6f8fa"/>

  <text class="h" x="30" y="40">SOFTWARE LAYERS</text>

  <rect class="a" x="30" y="56" width="600" height="72" rx="8"/>
  <text class="t" x="50" y="84">sms37 bridge (this project)</text>
  <text class="s" x="50" y="108">sms37.sh, json.awk, run.sh in /data/local/sms37</text>

  <rect class="c" x="30" y="140" width="600" height="72" rx="8"/>
  <text class="t" x="50" y="168">Tools shipped on the stick</text>
  <text class="s" x="50" y="192">curl 7.21.3 (OpenSSL 1.0.1e), sqlite3 3.7.11, BusyBox 1.31.0, runcon, su</text>

  <rect class="b" x="30" y="224" width="600" height="72" rx="8"/>
  <text class="t" x="50" y="252">Vendor MiFi layer</text>
  <text class="s" x="50" y="276">com.mifiservice.hello, Jetty web UI on port 80, DNS on port 53, hostapd, dnsmasq</text>

  <rect class="b" x="30" y="308" width="600" height="72" rx="8"/>
  <text class="t" x="50" y="336">Android 4.4.4 userdebug, build V2.3.12</text>
  <text class="s" x="50" y="360">phone, Messaging, Dialer, telephony and contacts providers; no display</text>

  <rect class="b" x="30" y="392" width="600" height="60" rx="8"/>
  <text class="t" x="50" y="418">Linux kernel with SELinux enforcing</text>
  <text class="s" x="50" y="438">adb shell is root (ro.secure=0), /system mounted read-only</text>

  <rect class="b" x="30" y="464" width="600" height="66" rx="8"/>
  <text class="t" x="50" y="492">Qualcomm MSM8916, armeabi-v7a userland</text>
  <text class="s" x="50" y="514">about 390 MB RAM, LTE modem, Wi-Fi, USB device port, SIM slot</text>

  <!-- USB side -->
  <text class="h" x="670" y="40">USB INTERFACES WITH ADB ON</text>
  <rect class="b" x="670" y="56" width="300" height="52" rx="8"/>
  <text class="t" x="686" y="79">RNDIS network</text>
  <text class="s" x="686" y="97">PC gets 192.168.100.x</text>
  <rect class="b" x="670" y="116" width="300" height="52" rx="8"/>
  <text class="t" x="686" y="139">serial_smd</text>
  <text class="s" x="686" y="157">modem serial port</text>
  <rect class="b" x="670" y="176" width="300" height="52" rx="8"/>
  <text class="t" x="686" y="199">diag</text>
  <text class="s" x="686" y="217">Qualcomm diagnostic port</text>
  <rect class="a" x="670" y="236" width="300" height="52" rx="8"/>
  <text class="t" x="686" y="259">adb</text>
  <text class="s" x="686" y="277">root shell, class ff/42/01</text>

  <text class="h" x="670" y="326">USB IDS</text>
  <rect class="b" x="670" y="342" width="300" height="52" rx="8"/>
  <text class="t" x="686" y="365">05c6:f00e</text>
  <text class="s" x="686" y="383">as sold: RNDIS only</text>
  <rect class="a" x="670" y="402" width="300" height="52" rx="8"/>
  <text class="t" x="686" y="425">05c6:90b6</text>
  <text class="s" x="686" y="443">after funcNo 2001: all four, kept across reboots</text>

  <text class="s" x="670" y="484">Serial number reads 0123456789ABCDEF.</text>
  <text class="s" x="670" y="504">lsusb may label f00e "FP3": that is only the</text>
  <text class="s" x="670" y="522">usb.ids name for this ID.</text>
</svg>
